# SQLite version 3.x
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
# development:
#   adapter: sqlite3
#   database: db/development.sqlite3
#   pool: 5
#   timeout: 5000

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  adapter: sqlite3
  database: db/test.sqlite3
  pool: 5
  timeout: 5000

# production:
#   adapter: mysql2
#   database: imentore
#   host: dns.imentore.com.br
#   pool: 5
#   timeout: 5000
#   username: imentore
#   password: 

# production:
#   adapter: mysql2
#   database: imentore
#   host: localhost
#   username: root
#   password: 123
#   pool: 5
#   timeout: 5000
development:
  adapter: mysql2
  database: <%= ENV.fetch("DATABASE_NAME", "imentore") %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "imentore") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "123") %>
  pool: 5
  timeout: 5000
