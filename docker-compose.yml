services:
  app:
    build:
      context: .
    working_dir: /app/imentore-base
    command: bundle exec rails server -b 0.0.0.0
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: imentore
      DATABASE_USERNAME: imentore
      DATABASE_PASSWORD: "123"
      RAILS_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: mysql:5.6
    environment:
      MYSQL_DATABASE: imentore
      MYSQL_USER: imentore
      MYSQL_PASSWORD: "123"
      MYSQL_ROOT_PASSWORD: "123"
    ports:
      - "3306:3306"
    volumes:
      - mysql56:/var/lib/mysql

volumes:
  mysql56:
